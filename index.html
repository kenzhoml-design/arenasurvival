<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Survival</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 { color: #ffb000; }
canvas {
  background: #263b32;
  border: 3px solid #ffb000;
  max-width: 95vw;
  width: 700px;
}
#info {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin: 12px;
  font-weight: bold;
}
button {
  padding: 12px 25px;
  background: #ff9d00;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>🔥 ARENA SURVIVAL 🔥</h1>
<div id="info">
  <span id="hp">HP: 100</span>
  <span id="score">SKOR: 0</span>
</div>

<canvas id="game" width="700" height="450"></canvas>
<p>Gerak: WASD / Tombol panah</p>
<p>Arahkan mouse dan klik untuk menembak!</p>
<button onclick="restart()">MAIN LAGI</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, bullets, enemies, score, hp, keys;
let mouse = {x:350, y:225};
let running = true;

function restart() {
  player = {x:350, y:225, size:14, speed:3};
  bullets = [];
  enemies = [];
  score = 0;
  hp = 100;
  running = true;
  update();
}

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});
document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX-r.left)*canvas.width/r.width;
  mouse.y = (e.clientY-r.top)*canvas.height/r.height;
});

canvas.addEventListener("click", () => {
  if (!running) return;
  let dx = mouse.x-player.x;
  let dy = mouse.y-player.y;
  let d = Math.hypot(dx,dy);
  bullets.push({
    x:player.x, y:player.y,
    vx:dx/d*7, vy:dy/d*7
  });
});

function spawnEnemy() {
  if (!running) return;
  let side = Math.floor(Math.random()*4);
  let x = side < 2 ? Math.random()*700 : (side===2?0:700);
  let y = side < 2 ? (side===0?0:450) : Math.random()*450;
  enemies.push({x,y,size:13,speed:0.8+Math.random()*0.5});
}
setInterval(spawnEnemy, 1300);

function update() {
  if (!running) return;
  ctx.clearRect(0,0,700,450);

  // Arena
  ctx.strokeStyle="#54735b";
  ctx.lineWidth=2;
  for(let x=0;x<700;x+=40){
    for(let y=0;y<450;y+=40){
      ctx.strokeRect(x,y,40,40);
    }
  }

  // Player movement
  if(keys["w"]||keys["arrowup"]) player.y-=player.speed;
  if(keys["s"]||keys["arrowdown"]) player.y+=player.speed;
  if(keys["a"]||keys["arrowleft"]) player.x-=player.speed;
  if(keys["d"]||keys["arrowright"]) player.x+=player.speed;

  player.x=Math.max(15,Math.min(685,player.x));
  player.y=Math.max(15,Math.min(435,player.y));

  // Player
  ctx.fillStyle="#00d9ff";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
  ctx.fill();

  // Bullets
  bullets.forEach((b,i)=>{
    b.x+=b.vx;
    b.y+=b.vy;
    ctx.fillStyle="#ffe600";
    ctx.beginPath();
    ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fill();
  });

  bullets=bullets.filter(b=>
    b.x>0&&b.x<700&&b.y>0&&b.y<450
  );

  // Enemies
  enemies.forEach((e,ei)=>{
    let dx=player.x-e.x;
    let dy=player.y-e.y;
    let d=Math.hypot(dx,dy)||1;

    e.x+=dx/d*e.speed;
    e.y+=dy/d*e.speed;

    ctx.fillStyle="#ff4545";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
    ctx.fill();

    if(d<25){
      hp-=0.3;
    }

    bullets.forEach((b,bi)=>{
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.size+5){
        enemies.splice(ei,1);
        bullets.splice(bi,1);
        score+=10;
      }
    });
  });

  document.getElementById("hp").innerText="HP: "+Math.max(0,Math.floor(hp));
  document.getElementById("score").innerText="SKOR: "+score;

  if(hp<=0){
    running=false;
    ctx.fillStyle="white";
    ctx.font="40px Arial";
    ctx.fillText("GAME OVER",235,210);
    ctx.font="20px Arial";
    ctx.fillText("Skor: "+score,310,250);
    return;
  }

  requestAnimationFrame(update);
}

keys={};
restart();
</script>
</body>
</html>=
